<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICL Italia - Catalogo Completo Tappeti Erbosi e Tecnologie</title>
    <style>
        :root {
            --primary-color: #1b4d3e;
            --primary-light: #2e7d62;
            --accent-color: #d4af37;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e2e8f0;
            --icl-blue: #005a9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            color: #172b3a;
            border-bottom: 4px solid #00acad;
            padding: 20px 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .search-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box input, .search-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.3s;
        }

        .search-box input:focus, .search-box select:focus {
            border-color: var(--primary-light);
        }

        .results-count {
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 0 5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
            header { padding: 35px; }
            header h1 { font-size: 2.2rem; }
            header p { font-size: 1.1rem; }
            .search-box { flex-direction: row; }
            .search-box input, .search-box select { flex: 1; min-width: 250px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-header {
            margin-bottom: 12px;
        }

        .category-tag {
            display: inline-block;
            background: #e8f5e9;
            color: var(--primary-color);
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .product-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badges-row {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .badge {
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .badge.n { background: #e3f2fd; color: #1565c0; }
        .badge.p { background: #f3e5f5; color: #7b1fa2; }
        .badge.k { background: #fff3e0; color: #e65100; }
        .badge.tech { background: #e0f2f1; color: #00695c; }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 0.8rem;
        }

        .details-table th, .details-table td {
            padding: 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .details-table th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 30px 15px;
            background: var(--card-bg);
            border-radius: 10px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 15px 10px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
        }

        footer p {
            margin-bottom: 5px;
        }
    </style>
</head>

        count.textContent = `Trovati ${dataToRender.length} prodotti`;

        }

        grid.innerHTML = dataToRender.map(p => {
            const techString = (p.tech + " " + p.techPercent + " " + p.category).toLowerCase();
            const hasPolyS = techString.includes('poly-s');
            const hasResin = techString.includes('resin') || techString.includes('resina') || techString.includes('pace');
            const hasPearl = techString.includes('pearl');
            const hasMu = techString.includes('mu') || p.category === 'Sierraform GT';
            const hasProLite = techString.includes('pro-lite') || techString.includes('zeolite');
            const hasWsf = techString.includes('idrosolubile') || techString.includes('wsf');

            let techIconsHtml = '';
            if (hasPolyS) techIconsHtml += `<span style="background:#e2f0d9; color:#385723; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">Poly-S</span>`;
            if (hasResin) techIconsHtml += `<span style="background:#d9e1f2; color:#1f4e79; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">Resina</span>`;
            if (hasPearl) techIconsHtml += `<span style="background:#fff2cc; color:#806000; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">Pearl</span>`;
            if (hasMu) techIconsHtml += `<span style="background:#fce4d6; color:#c65911; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">MU</span>`;
            if (hasProLite) techIconsHtml += `<span style="background:#e1f5fe; color:#01579b; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">Pro-Lite</span>`;
            if (hasWsf) techIconsHtml += `<span style="background:#e8f8f5; color:#117a65; padding:2px 5px; border-radius:4px; font-size:0.7rem; font-weight:bold; margin-left:3px;">WSF</span>`;

            return `
                <div class="product-card">
                    <div class="product-header">
                        <span class="category-tag">${p.category}</span>
                        <div class="product-title">
                            <span>${p.name}</span>
                            <div>${techIconsHtml}</div>
                        </div>
                        <div class="product-subtitle">Formula: <strong>${p.title}</strong></div>
                        <div class="badges-row">
                            <span class="badge">Durata: ${p.duration}</span>
                            ${p.n > 0 ? `<span class="badge n">N: ${p.n}%</span>` : ''}
                            ${p.p > 0 ? `<span class="badge p">P: ${p.p}%</span>` : ''}
                            ${p.k > 0 ? `<span class="badge k">K: ${p.k}%</span>` : ''}
                        </div>
                        <div class="badges-row">
                            <span class="badge tech">⚙️ ${p.techPercent}</span>
                        </div>
                    </div>
                    <div>
                        <table class="details-table">
                            <thead>
                                <tr><th colspan="2">Dettagli Tecnici</th></tr>
                            </thead>
                            <tbody>
                                ${Object.entries(p.details).map(([k, v]) => `
                                    <tr>
                                        <td>${k}</td>
                                        <td><strong>${v}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categorySelect').value;

        const filtered = products.filter(p => {
            const matchesQuery = p.name.toLowerCase().includes(query) || 
                                 p.title.toLowerCase().includes(query) || 
                                 p.category.toLowerCase().includes(query) || 
                                 p.tech.toLowerCase().includes(query) || 
                                 p.techPercent.toLowerCase().includes(query);
            const matchesCategory = category === "" || p.category === category;
            return matchesQuery && matchesCategory;
        });

        renderProducts(filtered);
    }

    renderProducts(products);
</script>

</body>
</html>
